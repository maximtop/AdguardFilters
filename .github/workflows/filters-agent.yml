# filters-agent test workflow for this fork: a labeled issue starts one run of the action.
name: 'filters-agent'

on:
    # `labeled`, not `opened`: every run is a paid LLM call, so a run only starts on a label a
    # maintainer adds themselves, deliberately, rather than on every issue anyone opens. GitHub
    # cannot filter by label name in this block — `labeled` fires for any label — so the job below
    # re-checks it.
    issues:
        types:
            - labeled
    workflow_dispatch:
        inputs:
            issueNumber:
                description: 'Issue number to analyze'
                required: true
                type: string

# The report comment posts from the workflow token. `contents: write` lets the run commit the
# before and after screenshots of a verified rule to the `filters-agent-screenshots` branch, which
# the comment shows them from.
permissions:
    contents: write
    issues: write

# No concurrency limit: every run restores the seeded AdGuard CLI home (seed-adguard-cli-home.yml)
# and shares its one licence device, so runs go in parallel.

jobs:
    analyze:
        # Manual dispatch always runs; an issue event runs only for the label this workflow owns.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'filters-agent' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  # The action takes its own token, so dropping the checkout credential keeps it out of
                  # .git/config in the mounted workspace, where run commands could read it.
                  persist-credentials: false

            # The AdGuard CLI blocker module: a pinned, verified CLI release and the module that drives
            # it, installed into the workspace, plus the seeded CLI home restored from the cache. The
            # action image itself carries no CLI.
            - name: Install the AdGuard CLI module
              id: adguard-cli
              uses: maximtop/filters-agent/adguard-cli@v1

            # @v1 follows every v1.x.y release; @main would run unreleased changes.
            - name: Analyze the issue
              id: agent
              uses: maximtop/filters-agent@v1
              # Secrets a plugged-in module needs reach it through the step's env, named by its
              # manifest; the action passes the module nothing else secret.
              env:
                  ADGUARD_LICENSE_KEY: ${{ secrets.ADGUARD_LICENSE_KEY }}
              with:
                  # Mandatory in every run: the action only serves GitHub-read modes, and the report
                  # comment posts through this token (the issues: write permission above).
                  githubToken: ${{ github.token }}
                  # TokenGuard through its public address. The address carries its own credential, so
                  # it is a secret like the key: GitHub masks both in the log, and the action redacts
                  # both from the run traces it uploads.
                  llmBaseUrl: ${{ secrets.FILTERS_AGENT_LLM_BASE_URL }}
                  llmApiKey: ${{ secrets.FILTERS_AGENT_LLM_API_KEY }}
                  llmModel: deepseek-v4-flash
                  llmVisionModel: gemini-3.7-flash
                  # The models' own limits at the gateway. The vision model stops at 65536, and a
                  # gateway that routes by the requested cap finds no endpoint for a larger one.
                  llmContextWindowTokens: '1048576'
                  llmMaxOutputTokens: '384000'
                  llmVisionMaxOutputTokens: '65536'
                  # TokenGuard sometimes cuts a response off mid-stream twice in a row; a third
                  # attempt keeps the run from ending without an answer.
                  llmRequestMaxAttempts: '3'
                  # Both blockers verify the rule: the built-in AdGuard Browser Extension, and the
                  # AdGuard CLI module as a filtering proxy. Drop one name to run the other alone.
                  blockerModules: ${{ steps.adguard-cli.outputs.manifest }}
                  executors: browser_extension,adguard_cli
                  # The label event carries the issue number directly; a manual dispatch carries it
                  # as the issueNumber input instead.
                  # Adult-site reports are never opened, so no screenshot of one is committed.
                  excludedLabels: NSFW
                  issueNumber: ${{ github.event.issue.number || inputs.issueNumber }}
                  # repository, checkoutPath and artifactsDir are not passed: the binding falls back to
                  # the runner's GITHUB_REPOSITORY and GITHUB_WORKSPACE. Inside the action's container
                  # the default artifacts directory is filters-agent-artifacts/artifacts under the
                  # checkout, and the artifacts-dir output is already workspace-relative, so the upload
                  # step below resolves it unchanged. The checkout's default instruction
                  # (.github/filters-agent/AGENTS.md) is probed automatically; pass instructionPath to
                  # override it.

            # A failed run is the one whose entry-result.json matters most, so the upload does not wait
            # for success; it is skipped only when the job was cancelled or the action exited before it
            # published an artifacts directory (missing inputs, missing browser).
            - name: Upload run artifacts
              if: ${{ !cancelled() && steps.agent.outputs.artifacts-dir != '' }}
              uses: actions/upload-artifact@v4
              with:
                  name: filters-agent-artifacts-${{ github.run_number }}
                  path: ${{ steps.agent.outputs.artifacts-dir }}
