# Feed the filters-agent test runs: every hour, copy each new AdguardFilters report from the AdGuard
# Browser Extension or AdGuard for Windows or Mac into this fork, and run filters-agent on it. At
# most five runs go at once, to keep the LLM gateway load even.
name: 'copy upstream issues'

on:
    schedule:
        # Hourly, off the top of the hour when scheduled runs pile up. Each run looks four hours
        # back: a run GitHub delays or skips is covered by the next, and reports already copied are
        # skipped.
        - cron: '17 * * * *'
    workflow_dispatch:
        inputs:
            sinceHours:
                description: 'Copy reports opened in the last this many hours'
                required: false
                default: '4'

# A copy that is still waiting for run slots finishes before the next starts, so two copies never
# race on the same report.
concurrency:
    group: copy-upstream-issues
    cancel-in-progress: false

permissions:
    # Recording each copy in copies.tsv on the filters-agent-copies branch.
    contents: write
    issues: write
    # Starting the agent workflow by dispatch: a label the workflow token adds starts nothing.
    actions: write

jobs:
    copy:
        runs-on: ubuntu-latest
        # Waits for a free run slot before each copy.
        timeout-minutes: 180
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts

            - name: Copy fresh reports and start runs
              env:
                  GH_TOKEN: ${{ github.token }}
                  SINCE_HOURS: ${{ inputs.sinceHours || '4' }}
              run: bash .github/scripts/copy-fresh-issues.sh "${SINCE_HOURS}"
