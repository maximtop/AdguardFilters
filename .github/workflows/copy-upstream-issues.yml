# Feed the filters-agent test runs: every day, copy each AdguardFilters report opened since the last
# copy from the AdGuard Browser Extension or AdGuard for Windows or Mac into this fork, and run
# filters-agent on it. At most five runs go at once, to keep the LLM gateway load even.
name: 'copy upstream issues'

on:
    schedule:
        # Daily, after the European morning brings in new reports.
        - cron: '0 9 * * *'
    workflow_dispatch:
        inputs:
            sinceHours:
                description: 'Copy reports opened in the last this many hours'
                required: false
                default: '24'

permissions:
    contents: read
    issues: write
    # Starting the agent workflow by dispatch: a label the workflow token adds starts nothing.
    actions: write

jobs:
    copy:
        runs-on: ubuntu-latest
        # Waits for a free run slot before each copy; a busy day takes hours. GitHub-hosted jobs end
        # at six hours.
        timeout-minutes: 350
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts

            - name: Copy fresh reports and start runs
              env:
                  GH_TOKEN: ${{ github.token }}
                  SINCE_HOURS: ${{ inputs.sinceHours || '24' }}
              run: bash .github/scripts/copy-fresh-issues.sh "${SINCE_HOURS}"
